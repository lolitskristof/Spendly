services:
  postgres:
    image: postgres:17
    container_name: spendly-postgres
    environment:
      POSTGRES_DB: spendly
      POSTGRES_USER: spendly
      POSTGRES_PASSWORD: spendly
    ports:
      - "5432:5432"
    volumes:
      - spendly-postgres-data:/var/lib/postgresql/data

volumes:
  spendly-postgres-data: