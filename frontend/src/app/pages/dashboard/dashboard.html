<section class="dashboard">
  <div class="page-header">
    <h1>Dashboard</h1>
    <p>Your monthly financial overview.</p>
  </div>

  <div class="section-header">
    <h2>Monthly summary</h2>
    <span class="section-description">Income and expenses</span>
  </div>

  <div class="summary-grid">
    <div class="summary-card">
      <span class="card-label">Income</span>
      <p class="card-value">—</p>
      <span class="card-description">Total income this month</span>
    </div>

    <div class="summary-card">
      <span class="card-label">Expenses</span>
      <p class="card-value">—</p>
      <span class="card-description">Total spending this month</span>
    </div>

    <div class="summary-card">
      <span class="card-label">Balance</span>
      <p class="card-value balance-value">—</p>
      <span class="card-description">Income minus expenses</span>
    </div>
  </div>
</section>
